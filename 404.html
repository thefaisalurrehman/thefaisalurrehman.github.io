<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Faisal ur Rehman</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .nf-inner { position: relative; z-index: 1; }
  .nf-code {
    font-family: var(--font-mono);
    font-size: clamp(64px, 16vw, 150px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.05em;
    background: linear-gradient(105deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .nf h1 { font-size: clamp(24px, 4vw, 36px); margin: 14px 0 12px; }
  .nf p { color: var(--text-2); max-width: 44ch; margin: 0 auto 30px; }
</style>
</head>
<body class="loaded">
  <section class="nf">
    <div class="ambient" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="grid"></span>
    </div>
    <div class="container nf-inner">
      <p class="nf-code">404</p>
      <h1>This screen doesn't exist.</h1>
      <p>The page you're looking for was moved, renamed, or never shipped in the first place.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </section>
</body>
</html>
